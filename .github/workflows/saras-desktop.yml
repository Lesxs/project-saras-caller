name: S.A.R.A.S Desktop — Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - desktop/tauri-bootstrap
    paths:
      - "desktop/**"
      - ".github/workflows/saras-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Generate application icons
        run: npx tauri icon ../icon-512.png

      - name: Build S.A.R.A.S installer
        run: npx tauri build --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: saras-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
