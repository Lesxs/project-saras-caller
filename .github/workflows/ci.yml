name: S.A.R.A.S - Validate and Build

on:
  push:
    branches:
      - main
      - 'saras/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate source
        run: npm run check

      - name: Run adaptive quality tests
        run: npm test

      - name: Build static release
        run: npm run build

      - name: Validate release output
        run: npm run check:dist

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: saras-caller-build
          path: dist/
          retention-days: 7
