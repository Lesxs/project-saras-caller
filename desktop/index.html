<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="S.A.R.A.S Desktop">
  <title>S.A.R.A.S</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <button class="brand" type="button" data-page="home" aria-label="Ir ao painel principal">
        <span class="brand-mark">S</span><span class="brand-name">S.A.R.A.S</span>
      </button>
      <nav class="side-nav" aria-label="Navegação principal">
        <button class="nav-item active" type="button" data-page="home"><span class="nav-icon">⌂</span>Painel principal</button>
        <button class="nav-item" type="button" data-page="stream"><span class="nav-icon">◉</span>Transmissão</button>
        <button class="nav-item" type="button" data-page="settings"><span class="nav-icon">⚙</span>Configurações</button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span><span>Pronto para usar</span></div>
    </aside>

    <main class="main-area">
      <header class="topbar"><span class="topbar-title" id="crumb">Painel principal</span><span class="topbar-brand">S.A.R.A.S <i>DESKTOP</i></span></header>

      <section class="page active" id="page-home">
        <div class="page-heading"><span class="eyebrow">SEU ESPAÇO</span><h1>Painel principal</h1><p>O que você deseja fazer?</p></div>
        <div class="action-grid">
          <button class="action-card featured" type="button" data-open-stream="transmit">
            <span class="action-icon">◉</span><strong>Transmitir</strong><span>Compartilhe seu jogo, uma janela ou a tela inteira.</span><b>Abrir transmissão <i>↗</i></b>
          </button>
          <button class="action-card" type="button" data-open-stream="join">
            <span class="action-icon">⇥</span><strong>Entrar em sala</strong><span>Encontre a transmissão dos seus amigos usando o código do grupo.</span><b>Entrar em uma sala <i>↗</i></b>
          </button>
          <button class="action-card" type="button" data-page="settings">
            <span class="action-icon">⚙</span><strong>Configurações</strong><span>Ajuste as preferências do aplicativo.</span><b>Abrir configurações <i>↗</i></b>
          </button>
        </div>
      </section>

      <section class="page stream-page" id="page-stream">
        <div class="page-heading compact-heading"><div><span class="eyebrow">S.A.R.A.S</span><h1>Transmissão</h1></div><button class="back-button" type="button" data-page="home">Voltar</button></div>
        <div class="stream-frame-wrap">
          <div class="frame-loading" id="frame-loading"><span class="loader"></span><span>Carregando transmissão...</span></div>
          <iframe id="stream-frame" title="Transmissão S.A.R.A.S" allow="camera; microphone; display-capture; autoplay; clipboard-read; clipboard-write; fullscreen" referrerpolicy="no-referrer"></iframe>
        </div>
      </section>

      <section class="page settings-page" id="page-settings">
        <div class="page-heading"><span class="eyebrow">PREFERÊNCIAS</span><h1>Configurações</h1><p>Personalize o aplicativo.</p></div>
        <div class="settings-panel">
          <div class="settings-section"><strong>Aparência</strong><label class="setting-row"><span><b>Efeitos visuais</b><small>Ativar efeitos discretos no painel principal.</small></span><input type="checkbox" id="effects-toggle" checked><i class="toggle"></i></label></div>
          <div class="settings-section about-section"><strong>Sobre</strong><div class="about-row"><span>Aplicativo</span><b>S.A.R.A.S Desktop</b></div><div class="about-row"><span>Versão</span><b>0.4.0</b></div><div class="about-row"><span>Sistema</span><b>Windows 10 / 11</b></div></div>
        </div>
      </section>
    </main>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
